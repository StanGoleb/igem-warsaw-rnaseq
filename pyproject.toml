[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igem-warsaw-rnaseq"
version = "0.1.0"
description = "iGEM 2026 Warsaw RNA-seq pipeline: public and local RNA-seq reads to a unified, normalised gene x sample dataset"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pyarrow>=15",
    "inmoose>=0.9",
    "pandera>=0.20",
]

[project.scripts]
igem-warsaw-rnaseq = "igem_warsaw_rnaseq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
